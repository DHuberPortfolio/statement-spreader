# Sign-in for the test suite: development mode with the base roles. dana and erin hold every working role so the
# older engine tests can act as one person. The suite runs the stricter two-person setup (both separation rules on)
# so those rules stay tested; test_identity checks the one-analyst default separately (D51).
extends: ../../config/finops/auth/roles-base.yaml
mode: development
organization: test-org
session: {secure_cookie: false}
separation_of_duties:
  approver_not_uploader: true
  approver_not_corrector: true
dev_users:
  - {username: ana, name: Ana, roles: [analyst]}
  - {username: sam, name: Sam, roles: [senior]}
  - {username: sid, name: Sid, roles: [analyst, senior]}
  - {username: dana, name: Dana, roles: [preparer, reviewer, approver, auditor]}
  - {username: erin, name: Erin, roles: [preparer, reviewer, approver, auditor]}
  - {username: pat, name: Pat, roles: [preparer]}
  - {username: rae, name: Rae, roles: [reviewer]}
  - {username: ari, name: Ari, roles: [approver]}
  - {username: aud, name: Aud, roles: [auditor]}
  - {username: adm, name: Adm, roles: [admin]}
  - {username: mia, name: Mia, roles: [manager]}
  - {username: both, name: Both, roles: [analyst, manager]}
  - {username: vic, name: Vic, roles: [viewer]}
  - {username: nobody, name: Nobody, roles: []}
