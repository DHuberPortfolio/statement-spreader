# Example: Okta with group claims. A second provider and organisation: only this file differs, no code.
extends: roles-base.yaml
mode: oidc
organization: example-insurer
oidc:
  issuer: https://example-insurer.okta.com/oauth2/default
  client_id: 0oaEXAMPLECLIENTID
  audience: ["api://finops"]
  client_secret_env: FINOPS_OIDC_CLIENT_SECRET
  redirect_uri: https://finops.example-insurer.com/api/auth/callback
  roles_claim: groups
  actor_claim: email
# A mid-size organisation on the default (D51): analysts correct and approve their own work, no separation rules.
role_map:
  financial-analysts: [analyst]
  finance-ap-clerks: [preparer]
  finance-controllers: [reviewer, approver]
  internal-audit: [auditor]
  finops-admins: [admin]
