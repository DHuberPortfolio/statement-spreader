# US commercial banks (US GAAP): the base template plus the lines a bank's statements are built from.
#
# A bank's income statement starts from interest, not revenue and cost of sales; its balance sheet is unclassified
# (no current/non-current split) and dominated by securities, loans and deposits. The base lines stay (a bank simply
# never prints cost of revenue or inventory, which leaves them empty), so a bank spread is comparable with any other.
# Wording written from one bank's 10-K (Fifth Third) and hand-checked on two others (eval/coverage/checks.json), then
# grown from the dev half of the bank answer-key set (eval/industry/bank, IMPROVEMENT_LOG B2-B3; holdout never tuned on).
# Load with SPREADER_PROFILE=config/profiles/us-bank.yaml.

extends: us-commercial.yaml
id: us-bank
version: "2026.10.25-bank-2"
title: US commercial bank spread (US GAAP)

add_lines:
  income_statement:
    - {id: bank_interest_income, label: Total interest income, kind: income, critical: true,
       aliases: [total interest income, total interest and dividend income, "total interest income*", interest income total],
       # "Interest income" alone is a commercial alias; under a net interest income heading it is the bank's (B3).
       sections: [{section: ["net interest income*"], labels: [interest income, interest and dividend income]}]}
    - {id: bank_interest_expense, label: Total interest expense, kind: cost,
       aliases: [total interest expense, "total interest expense*", interest expense total],
       sections: [{section: ["net interest income*"], labels: [interest expense]}]}
    - {id: net_interest_income, label: Net interest income, kind: result, critical: true,
       aliases: [net interest income, "net interest income fte", net interest revenue]}
    - {id: provision_credit_losses, label: Provision for credit losses, kind: cost, critical: true,
       aliases: [provision for credit losses, provision for loan and lease losses, provision for loan losses,
                 "provision for credit losses*", "provision benefit for credit losses*", "provision for loan*losses*"]}
    - {id: nii_after_provision, label: Net interest income after provision, kind: result,
       aliases: ["net interest income after provision*", net interest income after provision for credit losses]}
    - {id: noninterest_income, label: Total noninterest income, kind: income,
       aliases: [total noninterest income, total non interest income, "total noninterest income*", noninterest income total]}
    - {id: noninterest_expense, label: Total noninterest expense, kind: cost,
       aliases: [total noninterest expense, total non interest expense, total noninterest expenses, "total noninterest expense*"]}
    - {id: preferred_dividends, label: Preferred dividends, kind: cost,
       aliases: [dividends on preferred stock, preferred stock dividends, preferred dividends, "preferred stock dividends*",
                 "dividends on preferred stock*"]}
    - {id: net_income_common, label: Net income available to common shareholders, kind: result,
       aliases: [net income available to common shareholders, net income available to common stockholders,
                 net income applicable to common shareholders, net income applicable to common stock,
                 net income attributable to common shareholders]}
  balance_sheet:
    - {id: bank_securities, label: Investment securities, kind: asset,
       aliases: ["available for sale*securities*", "available for sale debt*", "held to maturity securities*",
                 "trading debt securities*", "trading securities*", equity securities, "investment securities*",
                 "securities available for sale*", "securities held to maturity*", "total investment securities*",
                 "held to maturity*", "debt securities*", "total debt securities*", "trading account assets*",
                 "trading account securities*", "equity securities*"]}
    - {id: loans_held_for_sale, label: Loans held for sale, kind: asset,
       aliases: ["loans held for sale*", "loans and leases held for sale*"]}
    - {id: loans_gross, label: Loans and leases, kind: asset, critical: true,
       aliases: ["portfolio loans and leases*", "loans and leases*", "total loans and leases*", "total loans*", "loans net of unearned*",
                 loans, total loans]}
    - {id: allowance_loan_losses, label: Allowance for loan and lease losses, kind: asset,
       aliases: ["allowance for loan and lease losses*", "allowance for loan losses*", "allowance for credit losses*",
                 "less allowance for*"]}
    - {id: loans_net, label: Loans and leases, net, kind: asset, critical: true,
       aliases: [portfolio loans and leases net, loans and leases net, net loans and leases, net loans, loans net,
                 total loans net, "loans and leases net of allowance*", "net loans and leases*"]}
    # Deposit detail rows ("Interest-bearing", "Savings") count only under a Deposits heading: worded alone, an
    # "interest-bearing deposits" row on the asset side is money the bank keeps at other banks (IMPROVEMENT_LOG B2).
    - {id: deposits, label: Deposits, kind: liability, critical: true,
       aliases: [total deposits, deposits, "total deposits*"],
       sections: [{section: ["deposits*"],
                   labels: ["noninterest bearing*", "non interest bearing*", "interest bearing*", "noninterestbearing*",
                            "interestbearing*", "demand*", "savings*", "money market*", "time*", "checking*",
                            "certificates of deposit*", "brokered*", "foreign*", "domestic*"]}]}
    # The commercial common-stock line also has "preferred stock*"; these longer patterns win that tie.
    - {id: preferred_equity, label: Preferred stock, kind: equity,
       aliases: [preferred stock, "preferred stock*", "preferred stock*par value*", "preferred stock*authorized*",
                 "preferred stock*liquidation*", "preferred stock*series*", "preferred stock*issued*",
                 "non cumulative perpetual*", "noncumulative perpetual*", "perpetual preferred*"],
       sections: [{section: ["preferred stock*"], labels: ["non cumulative*", "noncumulative*", "series*", "perpetual*"]}]}
  cash_flow:
    - {id: cf_deposits_net, label: Net change in deposits, kind: flow,
       aliases: [net change in deposits, "net increase in deposits*", "net increase decrease in deposits*", "net decrease in deposits*",
                 "net change in deposits*"]}

add_aliases:
  income_tax: [applicable income tax expense, applicable income taxes, "applicable income tax*"]
  shares_basic: [average common shares outstanding basic, "average common shares outstanding basic*"]
  shares_diluted: [average common shares outstanding diluted, "average common shares outstanding diluted*"]
  common_stock_apic: [capital surplus, "capital surplus*"]
  ppe_net: ["bank premises and equipment*", "premises and equipment*"]
  st_investments: [other short term investments, "other short term investments*", "interest bearing deposits with banks*",
                   "federal funds sold*", "interest bearing deposits*", "interest earning deposits*", resell agreements,
                   "securities purchased under agreements to resell*", "money market and other interest earning*",
                   "money market investments*"]
  intangibles: ["other identifiable intangible*", "core deposit intangible*"]

add_sections:
  eps_basic: [{section: ["per common share information*", "per common share*"], labels: [earnings, basic earnings, basic]}]
  eps_diluted: [{section: ["per common share information*", "per common share*"], labels: [diluted earnings, diluted]}]

checks:
  - {id: bank_nii, statement: income_statement, title: "Interest income minus interest expense equals net interest income",
     lhs: net_interest_income, rhs: "bank_interest_income - bank_interest_expense"}
  - {id: bank_nii_after_provision, statement: income_statement, title: "Net interest income minus the provision",
     lhs: nii_after_provision, rhs: "net_interest_income - provision_credit_losses"}
  - {id: bank_pretax, statement: income_statement, title: "Net interest income after provision, plus noninterest income, minus noninterest expense, equals pre-tax income",
     lhs: pretax_income, rhs: "net_interest_income - provision_credit_losses + noninterest_income - noninterest_expense", severity: warning}
  - {id: bank_common, statement: income_statement, title: "Net income less preferred dividends and noncontrolling interests equals net income to common",
     lhs: net_income_common, rhs: "net_income - nci_net_income_or_zero - preferred_dividends_or_zero", severity: warning}
  - {id: is_eps, statement: income_statement, title: "Basic EPS times basic shares is close to net income to common",
     lhs: "eps_basic * shares_basic", rhs: "coalesce(net_income_common, net_income_parent)", relative_tolerance: 0.02, severity: warning}
  - {id: is_eps_diluted, statement: income_statement, title: "Diluted EPS times diluted shares is close to net income to common",
     lhs: "eps_diluted * shares_diluted", rhs: "coalesce(net_income_common, net_income_parent)", relative_tolerance: 0.02,
     severity: warning, role: confirm}
  - {id: bank_loans_net, statement: balance_sheet, title: "Loans less the allowance equal net loans",
     lhs: loans_net, rhs: "loans_gross + allowance_loan_losses", severity: warning,
     note: "The allowance is printed as a deduction (negative)."}

ratios:
  - {id: bank_nim_proxy, label: "Net interest income / total assets", expr: "net_interest_income / total_assets", format: percent}
  - {id: bank_efficiency, label: "Efficiency ratio (noninterest expense / revenue)",
     expr: "noninterest_expense / (net_interest_income + noninterest_income)", format: percent}
  - {id: bank_loans_to_deposits, label: Loans to deposits, expr: "loans_net / deposits", format: percent}

# Base checks and ratios that do not hold for a bank (D50): shown on the profile with the reason, never run.
not_applicable:
  checks:
    bs_current_assets: "Bank balance sheets are unclassified: there is no current-assets subtotal to check"
    bs_current_liabilities: "Bank balance sheets are unclassified: there is no current-liabilities subtotal to check"
    bs_assets_parts: "Rests on the current / non-current split, which banks do not present"
    bs_liabilities_parts: "Rests on the current / non-current split, which banks do not present"
    is_gross_profit: "Banks report no revenue less cost of sales: income starts from interest"
    is_operating: "Banks report no operating income built from gross profit"
    is_operating_total_costs: "Banks report no operating income; pre-tax income is checked by bank_pretax"
    is_pretax: "The corporate bridge from operating income does not exist for banks; bank_pretax replaces it"
  ratios:
    gross_margin: "No gross profit for a bank"
    operating_margin: "No operating income for a bank"
    ebitda: "Depreciation-adjusted operating profit is not a bank measure; interest is the business itself"
    ebitda_margin: "As EBITDA: not a bank measure"
    current_ratio: "Unclassified balance sheet: liquidity is judged on liquidity-coverage data these statements lack"
    quick_ratio: "Unclassified balance sheet: no current liabilities to divide by"
    total_debt: "For a bank, borrowings exclude deposits, the main funding; a debt total would mislead"
    debt_to_equity: "Bank leverage is measured by regulatory capital ratios, which these statements do not give"
    debt_to_ebitda: "Neither debt nor EBITDA means for a bank what it means for a company"
    interest_coverage: "Interest expense is a bank's cost of funding, not a debt service burden"
    dso: "Banks have loans, not trade receivables"
    dio: "Banks hold no inventory"
    dpo: "Banks have no cost of sales or trade payables cycle"
    free_cash_flow: "A bank's operating cash flow includes lending and deposit flows; free cash flow is not meaningful"
