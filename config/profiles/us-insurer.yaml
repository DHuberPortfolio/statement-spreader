# US property-casualty and life insurers (US GAAP): the base template plus the lines an insurer's statements are built
# from. Revenue is premiums plus investment income; the big costs are claims (losses and loss adjustment expenses) and
# acquisition costs; the balance sheet is investments on one side and reserves on the other, unclassified.
# Wording written from one insurer's 10-K (Travelers) and hand-checked on two others (eval/coverage/checks.json), then
# grown from the dev half of the insurer answer-key set (eval/industry/insurer, IMPROVEMENT_LOG B2-B3; holdout never
# tuned on).
# Load with SPREADER_PROFILE=config/profiles/us-insurer.yaml.

extends: us-commercial.yaml
id: us-insurer
version: "2026.10.25-insurer-2"
title: US insurer spread (US GAAP)

add_lines:
  income_statement:
    - {id: premiums_earned, label: Premiums earned, kind: income, critical: true,
       aliases: [premiums, premiums earned, net premiums earned, earned premiums, net earned premiums, "net premiums earned*",
                 "premiums earned*", total premiums earned, net premiums, total premium, total premiums,
                 "premiums and other considerations*", "net premiums*"]}
    - {id: net_investment_income, label: Net investment income, kind: income,
       aliases: [net investment income, "net investment income*", investment income net, "investment income net of*"]}
    - {id: realized_investment_gains, label: Net realized investment gains (losses), kind: either,
       aliases: ["net realized investment gains*", "net realized investment losses*", "net realized gains*", "net realized losses*",
                 "realized investment gains*", "net investment gains*", "net investment losses*", "net gains losses on investments*",
                 "investment gains*", "investment losses*", "net realized capital*", "investment related gains*",
                 "investment related losses*", "realized gains*", "realized losses*", "total net realized*",
                 "net realized and unrealized*"]}
    - {id: losses_lae, label: Losses and loss adjustment expenses, kind: cost, critical: true,
       aliases: [claims and claim adjustment expenses, losses and loss adjustment expenses, losses and loss expenses,
                 "losses and loss adjustment expenses*", "claims and claim adjustment expenses*", "losses and lae*",
                 "policyholder benefits and claims*", "benefits losses and loss adjustment expenses*", "losses and benefits*",
                 net losses and loss adjustment expenses, "incurred losses*", "insurance losses*",
                 "claims and other policy benefits*", "benefits claims and settlement expenses*",
                 "insurance claims and policyholders benefits*", "total policyholder benefits*"]}
    - {id: acquisition_costs, label: Policy acquisition costs, kind: cost,
       aliases: [amortization of deferred acquisition costs, "amortization of deferred policy acquisition costs*",
                 policy acquisition costs, "policy acquisition costs*", "amortization of deferred acquisition costs*"]}
    - {id: total_insurance_expenses, label: Total claims and expenses, kind: cost,
       aliases: [total claims and expenses, total losses and expenses, total benefits losses and expenses, total expenses,
                 total benefits and expenses, total costs and expenses],
       # "Total expenses" is also a commercial alias (total costs): an exact tie leaves the row unmapped, so under an
       # expenses heading the insurer's total takes it (IMPROVEMENT_LOG B2).
       sections: [{section: ["expenses", "benefits and expenses", "benefits losses and expenses", "losses and expenses",
                             "benefits claims and expenses", "expenses*"],
                   labels: [total, total expenses, total benefits and expenses, total costs and expenses,
                            total losses and expenses, total benefits losses and expenses]}]}
  balance_sheet:
    - {id: insurer_investments, label: Total investments, kind: asset, critical: true,
       aliases: [total investments, "total investments*"]}
    - {id: premiums_receivable, label: Premiums receivable, kind: asset,
       aliases: ["premiums receivable*", "premiums and other receivables*", "premiums and agents balances*",
                 "premiums due and other receivables*", "premiums and accounts receivable*",
                 "premiums reinsurance and other receivables*"]}
    - {id: reinsurance_recoverables, label: Reinsurance recoverables, kind: asset,
       aliases: ["reinsurance recoverables*", "reinsurance recoverable*"]}
    - {id: deferred_acquisition_costs, label: Deferred acquisition costs, kind: asset,
       aliases: ["deferred acquisition costs*", "deferred policy acquisition costs*"]}
    - {id: loss_reserves, label: Loss and loss adjustment expense reserves, kind: liability, critical: true,
       aliases: ["claims and claim adjustment expense reserves*", "loss and loss adjustment expense reserves*",
                 "unpaid losses and loss adjustment expenses*", "loss and loss adjustment expenses*", "reserve for losses*",
                 "liability for unpaid losses*", "reserves for losses and loss adjustment expenses*"]}
    - {id: unearned_premiums, label: Unearned premiums, kind: liability,
       aliases: ["unearned premium reserves*", "unearned premiums*", "reserve for unearned premiums*"]}
    - {id: future_policy_benefits, label: Future policy benefits, kind: liability,
       aliases: ["future policy benefits*", "contractholder funds*", "policyholder account balances*"]}

add_aliases:
  lt_debt: [debt, "debt*", senior notes, "senior notes*"]
  cash: ["cash including restricted cash*"]

add_sections:
  eps_basic: [{section: ["per common share*", "per share*"], labels: [net income basic, basic, "net income basic*"]}]
  eps_diluted: [{section: ["per common share*", "per share*"], labels: [net income diluted, diluted, "net income diluted*"]}]

checks:
  - {id: insurer_pretax, statement: income_statement, title: "Total revenues minus total claims and expenses equals pre-tax income",
     lhs: pretax_income, rhs: "revenue - total_insurance_expenses", severity: warning}

ratios:
  - {id: insurer_loss_ratio, label: "Loss ratio (losses / premiums earned)", expr: "losses_lae / premiums_earned", format: percent}
  - {id: insurer_expense_ratio, label: "Acquisition cost ratio", expr: "acquisition_costs / premiums_earned", format: percent}
  - {id: insurer_reserves_to_equity, label: "Loss reserves / equity", expr: "loss_reserves / total_equity", format: times}

# Base checks and ratios that do not hold for an insurer (D50): shown on the profile with the reason, never run.
not_applicable:
  checks:
    bs_current_assets: "Insurer balance sheets are unclassified: there is no current-assets subtotal to check"
    bs_current_liabilities: "Insurer balance sheets are unclassified: there is no current-liabilities subtotal to check"
    bs_assets_parts: "Rests on the current / non-current split, which insurers do not present"
    bs_liabilities_parts: "Rests on the current / non-current split, which insurers do not present"
    is_gross_profit: "Insurers report premiums and claims, not revenue less cost of sales"
    is_operating: "Insurers report no operating income built from gross profit"
    is_operating_total_costs: "Insurers report no operating income; pre-tax income is checked by insurer_pretax"
    is_pretax: "The corporate bridge from operating income does not exist for insurers; insurer_pretax replaces it"
  ratios:
    gross_margin: "No gross profit for an insurer"
    operating_margin: "No operating income for an insurer"
    ebitda: "Not an insurance measure: claims and reserves, not depreciation, drive results"
    ebitda_margin: "As EBITDA: not an insurance measure"
    current_ratio: "Unclassified balance sheet: no current subtotals"
    quick_ratio: "Unclassified balance sheet: no current liabilities to divide by"
    debt_to_ebitda: "EBITDA is not an insurance measure"
    interest_coverage: "Rests on operating income, which insurers do not report"
    dso: "Premiums receivable are not trade receivables against sales"
    dio: "Insurers hold no inventory"
    dpo: "Insurers have no cost of sales or trade payables cycle"
